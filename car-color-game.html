<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0f1e">
  <title>Car Color Hunt</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1e;
      color: #fff;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 14px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 10px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .progress-pill {
      background: #1a1a2e;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .progress-pill .found {
      color: #06d6a0;
      font-size: 16px;
      font-weight: 800;
    }

    .progress-bar {
      height: 4px;
      background: #1a1a2e;
      margin: 0 14px 8px;
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4cc9f0, #06d6a0);
      width: 0%;
      transition: width 0.3s ease;
    }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px 8px;
    }

    .color-btn {
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, opacity 0.2s ease;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.15), 0 3px 6px rgba(0, 0, 0, 0.3);
      aspect-ratio: 1.1 / 1;
      overflow: hidden;
      padding: 4px;
    }

    .color-btn:active {
      transform: scale(0.94);
    }

    .color-btn .label {
      font-size: 12px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      text-align: center;
      line-height: 1.1;
      padding: 2px;
    }

    .color-btn.found {
      opacity: 0.55;
    }

    .color-btn.found::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 56px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.7), 0 2px 4px rgba(0, 0, 0, 0.8);
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop {
      0%   { transform: translate(-50%, -50%) scale(0) rotate(-90deg); }
      60%  { transform: translate(-50%, -50%) scale(1.4) rotate(8deg); }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0); }
    }

    .pop-text {
      position: fixed;
      pointer-events: none;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.7);
      z-index: 150;
      animation: floatUp 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      white-space: nowrap;
    }

    @keyframes floatUp {
      0%   { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
      15%  { transform: translate(-50%, -20px) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(1); opacity: 0; }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      z-index: 140;
      border-radius: 2px;
    }

    /* Color themes */
    .c-white   { background: #f5f5f5; color: #222; }
    .c-white .label { text-shadow: none; }
    .c-black   { background: #0a0a0a; }
    .c-matte   { background: #2a2a2a; }
    .c-gray    { background: #7c7c7c; }
    .c-silver  { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #222; }
    .c-silver .label { text-shadow: none; }
    .c-red     { background: #d62828; }
    .c-maroon  { background: #6e1414; }
    .c-pink    { background: #ec4899; }
    .c-orange  { background: #f97316; }
    .c-yellow  { background: #facc15; color: #1a1a1a; }
    .c-yellow .label { text-shadow: none; }
    .c-gold    { background: linear-gradient(135deg, #d4a017, #f4cf4d); color: #1a1a1a; }
    .c-gold .label { text-shadow: none; }
    .c-tan     { background: #d4b483; color: #1a1a1a; }
    .c-tan .label { text-shadow: none; }
    .c-brown   { background: #5a2e0c; }
    .c-lblue   { background: #7dd3fc; color: #1a1a1a; }
    .c-lblue .label { text-shadow: none; }
    .c-blue    { background: #1d4ed8; }
    .c-navy    { background: #0f1f4a; }
    .c-teal    { background: #0d9488; }
    .c-lime    { background: #84cc16; color: #1a1a1a; }
    .c-lime .label { text-shadow: none; }
    .c-green   { background: #15803d; }
    .c-forest  { background: #14532d; }
    .c-purple  { background: #7e22ce; }
    .c-magenta { background: #c026d3; }
    .c-copper  { background: linear-gradient(135deg, #b87333, #d97706); }
    .c-beige   { background: #f5f5dc; color: #1a1a1a; }
    .c-beige .label { text-shadow: none; }
    .c-burgundy { background: #800020; }
    .c-cream   { background: #fffdd0; color: #1a1a1a; }
    .c-cream .label { text-shadow: none; }
    .c-multi   { background: linear-gradient(135deg, #f97316 0%, #ec4899 33%, #8b5cf6 66%, #06b6d4 100%); }

    footer {
      display: flex;
      gap: 8px;
      padding: 8px 12px 12px;
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .reset {
      background: #ef233c;
      color: #fff;
    }

    .stats-btn {
      background: #06d6a0;
      color: #0d1b2a;
    }

    /* Win banner */
    .win-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #1a1a1a;
      padding: 24px 36px;
      border-radius: 20px;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      z-index: 200;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .win-banner.show {
      transform: translate(-50%, -50%) scale(1);
    }

    .win-banner .sub {
      font-size: 14px;
      font-weight: 600;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 24px 20px;
      max-width: 360px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 14px;
      text-align: center;
    }

    .modal-list {
      overflow-y: auto;
      flex: 1;
      margin-bottom: 12px;
    }

    .modal-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .modal-row .swatch {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .modal-row .name {
      flex: 1;
    }

    .modal-row .check {
      font-size: 16px;
    }

    .modal-row.found .name { text-decoration: line-through; opacity: 0.6; }
    .modal-row.found .check { color: #06d6a0; }
    .modal-row:not(.found) .check { color: #555; }

    .modal-btn {
      padding: 12px;
      background: #4cc9f0;
      color: #0d1b2a;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    @media (min-width: 480px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (orientation: landscape) and (max-width: 900px) {
      .grid { grid-template-columns: repeat(6, 1fr); }
      .color-btn { aspect-ratio: 1.3 / 1; }
      .color-btn.found::after { font-size: 40px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">CAR COLOR HUNT</div>
    <div class="progress-pill"><span class="found" id="foundCount">0</span> / <span id="totalCount">0</span> found</div>
  </header>

  <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>

  <div class="grid" id="grid"></div>

  <footer>
    <button class="action-btn stats-btn" id="statsBtn">List</button>
    <button class="action-btn reset" id="resetBtn">Reset</button>
  </footer>

  <div class="win-banner" id="winBanner">
    🎉 You Got Them All! 🎉
    <div class="sub">All colors found</div>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2 id="modalTitle">Colors</h2>
      <div class="modal-list" id="modalList"></div>
      <button class="modal-btn" id="modalClose">Close</button>
    </div>
  </div>

  <script>
    const COLORS = [
      { key: 'white',    label: 'White',     cls: 'c-white' },
      { key: 'black',    label: 'Black',     cls: 'c-black' },
      { key: 'matte',    label: 'Matte Black', cls: 'c-matte' },
      { key: 'gray',     label: 'Gray',      cls: 'c-gray' },
      { key: 'silver',   label: 'Silver',    cls: 'c-silver' },
      { key: 'red',      label: 'Red',       cls: 'c-red' },
      { key: 'maroon',   label: 'Maroon',    cls: 'c-maroon' },
      { key: 'burgundy', label: 'Burgundy',  cls: 'c-burgundy' },
      { key: 'pink',     label: 'Pink',      cls: 'c-pink' },
      { key: 'orange',   label: 'Orange',    cls: 'c-orange' },
      { key: 'yellow',   label: 'Yellow',    cls: 'c-yellow' },
      { key: 'gold',     label: 'Gold',      cls: 'c-gold' },
      { key: 'beige',    label: 'Beige',     cls: 'c-beige' },
      { key: 'cream',    label: 'Cream',     cls: 'c-cream' },
      { key: 'tan',      label: 'Tan',       cls: 'c-tan' },
      { key: 'brown',    label: 'Brown',     cls: 'c-brown' },
      { key: 'copper',   label: 'Copper',    cls: 'c-copper' },
      { key: 'lblue',    label: 'Light Blue', cls: 'c-lblue' },
      { key: 'blue',     label: 'Blue',      cls: 'c-blue' },
      { key: 'navy',     label: 'Navy',      cls: 'c-navy' },
      { key: 'teal',     label: 'Teal',      cls: 'c-teal' },
      { key: 'lime',     label: 'Lime',      cls: 'c-lime' },
      { key: 'green',    label: 'Green',     cls: 'c-green' },
      { key: 'forest',   label: 'Forest',    cls: 'c-forest' },
      { key: 'purple',   label: 'Purple',    cls: 'c-purple' },
      { key: 'magenta',  label: 'Magenta',   cls: 'c-magenta' },
      { key: 'multi',    label: 'Multi / Wrap', cls: 'c-multi' }
    ];

    const STORAGE_KEY = 'carColorHunt_v2';

    let found = loadFound();

    function loadFound() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        const out = {};
        COLORS.forEach(c => out[c.key] = !!saved[c.key]);
        return out;
      } catch (e) {
        const out = {};
        COLORS.forEach(c => out[c.key] = false);
        return out;
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(found));
    }

    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      COLORS.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'color-btn ' + c.cls;
        btn.dataset.key = c.key;
        btn.innerHTML = `<div class="label">${c.label}</div>`;
        btn.addEventListener('click', () => toggle(c.key));
        grid.appendChild(btn);
      });
      document.getElementById('totalCount').textContent = COLORS.length;
      render();
    }

    function toggle(key) {
      const wasFound = found[key];
      found[key] = !wasFound;
      save();
      render();
      if (!wasFound) {
        celebrate(key);
        if (allFound()) {
          setTimeout(showWinBanner, 200);
        }
      } else {
        vibrate(10);
      }
    }

    function celebrate(key) {
      const btn = document.querySelector(`.color-btn[data-key="${key}"]`);
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      vibrate([15, 30, 25]);

      const cheers = [
        { text: 'WOOHOO!',  speak: 'Woohoo!' },
        { text: 'HOORAY!',  speak: 'Hooray!' },
        { text: 'GOT IT!',  speak: 'Got it!' },
        { text: 'YES!',     speak: 'Yes!' },
        { text: 'NICE!',    speak: 'Nice!' },
        { text: 'SWEET!',   speak: 'Sweet!' },
        { text: 'BOOM!',    speak: 'Boom!' },
        { text: 'AWESOME!', speak: 'Awesome!' }
      ];
      const cheer = cheers[Math.floor(Math.random() * cheers.length)];
      speakCheer(cheer.speak);
      playHooray();

      const text = document.createElement('div');
      text.className = 'pop-text';
      text.textContent = cheer.text;
      text.style.left = cx + 'px';
      text.style.top = cy + 'px';
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 1100);

      const colors = ['#facc15', '#06d6a0', '#4cc9f0', '#ef233c', '#a855f7', '#f97316'];
      for (let i = 0; i < 14; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.background = colors[i % colors.length];
        c.style.left = cx + 'px';
        c.style.top = cy + 'px';
        const angle = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.5;
        const dist = 80 + Math.random() * 70;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist - 30;
        const rot = (Math.random() - 0.5) * 720;
        c.animate([
          { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot}deg)`, opacity: 0 }
        ], { duration: 900 + Math.random() * 300, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' });
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 1300);
      }
    }

    function speakCheer(phrase) {
      try {
        if (!('speechSynthesis' in window)) return;
        // Cancel any pending speech so rapid taps don't queue up
        speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(phrase);
        utter.rate = 1.15;
        utter.pitch = 1.4;
        utter.volume = 1;
        // Prefer an English voice if one is loaded
        const voices = speechSynthesis.getVoices();
        const preferred = voices.find(v => /en[-_]US/i.test(v.lang) && /samantha|karen|google|female/i.test(v.name))
                       || voices.find(v => /^en/i.test(v.lang));
        if (preferred) utter.voice = preferred;
        speechSynthesis.speak(utter);
      } catch (e) {}
    }

    // Some browsers load voices asynchronously
    if ('speechSynthesis' in window) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    let audioCtx;
    function playHooray() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 — major arpeggio

        notes.forEach((freq, i) => {
          const start = now + i * 0.07;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.32);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + 0.35);
        });
      } catch (e) {
        // audio not available — silent fallback
      }
    }

    function allFound() {
      return COLORS.every(c => found[c.key]);
    }

    function reset() {
      if (!confirm('Reset all check-offs?')) return;
      COLORS.forEach(c => found[c.key] = false);
      save();
      render();
      vibrate(40);
    }

    function render() {
      let count = 0;
      document.querySelectorAll('.color-btn').forEach(btn => {
        const key = btn.dataset.key;
        if (found[key]) {
          btn.classList.add('found');
          count++;
        } else {
          btn.classList.remove('found');
        }
      });
      document.getElementById('foundCount').textContent = count;
      const pct = (count / COLORS.length) * 100;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function showWinBanner() {
      const banner = document.getElementById('winBanner');
      banner.classList.add('show');
      vibrate([50, 50, 50, 50, 100]);
      playFanfare();
      setTimeout(() => banner.classList.remove('show'), 2800);
    }

    function playFanfare() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        // Triumphant "ta-da!" - C E G C / hold high C
        const seq = [
          { f: 523.25, t: 0,    d: 0.18 },
          { f: 659.25, t: 0.18, d: 0.18 },
          { f: 783.99, t: 0.36, d: 0.18 },
          { f: 1046.5, t: 0.54, d: 0.6 }
        ];
        seq.forEach(n => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, now + n.t);
          gain.gain.setValueAtTime(0, now + n.t);
          gain.gain.linearRampToValueAtTime(0.22, now + n.t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now + n.t);
          osc.stop(now + n.t + n.d + 0.05);
        });
      } catch (e) {}
    }

    function showList() {
      const list = document.getElementById('modalList');
      const title = document.getElementById('modalTitle');
      const foundCount = COLORS.filter(c => found[c.key]).length;
      title.textContent = `Colors — ${foundCount} / ${COLORS.length} found`;

      const sorted = [...COLORS].sort((a, b) => {
        const af = found[a.key] ? 1 : 0;
        const bf = found[b.key] ? 1 : 0;
        return af - bf;
      });

      list.innerHTML = sorted.map(c => {
        const isFound = found[c.key];
        return `
          <div class="modal-row ${isFound ? 'found' : ''}">
            <div class="swatch ${c.cls}"></div>
            <div class="name">${c.label}</div>
            <div class="check">${isFound ? '✓' : '○'}</div>
          </div>
        `;
      }).join('');

      document.getElementById('modalBg').classList.add('show');
    }

    function vibrate(ms) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    document.getElementById('resetBtn').addEventListener('click', reset);
    document.getElementById('statsBtn').addEventListener('click', showList);
    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalBg').classList.remove('show');
    });
    document.getElementById('modalBg').addEventListener('click', (e) => {
      if (e.target.id === 'modalBg') {
        document.getElementById('modalBg').classList.remove('show');
      }
    });

    buildGrid();
  </script>
</body>
</html>
