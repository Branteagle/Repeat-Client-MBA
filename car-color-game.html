<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <title>Car Color Counter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      padding: 12px 16px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .total {
      font-size: 14px;
      background: #16213e;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
    }

    .total span {
      color: #4cc9f0;
      font-size: 18px;
      margin-left: 4px;
    }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px;
      min-height: 0;
    }

    .color-btn {
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.08s ease;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.15), 0 4px 8px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      padding: 8px;
    }

    .color-btn:active {
      transform: scale(0.95);
    }

    .color-btn .count {
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .color-btn .label {
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .color-btn .minus {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      border: none;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .color-btn .minus:active {
      background: rgba(0, 0, 0, 0.7);
    }

    /* Color themes */
    .c-white { background: #f5f5f5; color: #222; }
    .c-white .label, .c-white .count { text-shadow: none; }
    .c-black { background: #1a1a1a; color: #fff; }
    .c-gray { background: #7c7c7c; }
    .c-silver { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #222; }
    .c-silver .label, .c-silver .count { text-shadow: none; }
    .c-red { background: #d62828; }
    .c-blue { background: #1d4ed8; }
    .c-green { background: #15803d; }
    .c-yellow { background: #facc15; color: #1a1a1a; }
    .c-yellow .label, .c-yellow .count { text-shadow: none; }
    .c-orange { background: #f97316; }
    .c-brown { background: #78350f; }
    .c-other { background: linear-gradient(135deg, #a855f7, #ec4899); }

    footer {
      display: flex;
      gap: 8px;
      padding: 8px 12px 12px;
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .undo {
      background: #16213e;
      color: #4cc9f0;
    }

    .reset {
      background: #ef233c;
      color: #fff;
    }

    .winner {
      background: #06d6a0;
      color: #0d1b2a;
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      background: #16213e;
      border-radius: 16px;
      padding: 24px;
      max-width: 320px;
      width: 100%;
      text-align: center;
    }

    .modal h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .modal .leader-list {
      text-align: left;
      margin: 16px 0;
      max-height: 50vh;
      overflow-y: auto;
    }

    .modal .leader-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .modal .leader-row.first {
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #1a1a1a;
      font-weight: 700;
    }

    .modal .leader-row.second {
      background: rgba(255, 255, 255, 0.15);
    }

    .modal .leader-row.third {
      background: rgba(255, 255, 255, 0.08);
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      background: #4cc9f0;
      color: #0d1b2a;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 8px;
    }

    @media (orientation: landscape) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
      .color-btn .count {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">CAR COLOR COUNTER</div>
    <div class="total">Total<span id="total">0</span></div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    <button class="action-btn undo" id="undoBtn">Undo</button>
    <button class="action-btn winner" id="winnerBtn">Winner</button>
    <button class="action-btn reset" id="resetBtn">Reset</button>
  </footer>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2 id="modalTitle">Standings</h2>
      <div class="leader-list" id="leaderList"></div>
      <button class="modal-btn" id="modalClose">Close</button>
    </div>
  </div>

  <script>
    const COLORS = [
      { key: 'white',  label: 'White',  cls: 'c-white' },
      { key: 'black',  label: 'Black',  cls: 'c-black' },
      { key: 'gray',   label: 'Gray',   cls: 'c-gray' },
      { key: 'silver', label: 'Silver', cls: 'c-silver' },
      { key: 'red',    label: 'Red',    cls: 'c-red' },
      { key: 'blue',   label: 'Blue',   cls: 'c-blue' },
      { key: 'green',  label: 'Green',  cls: 'c-green' },
      { key: 'yellow', label: 'Yellow', cls: 'c-yellow' },
      { key: 'orange', label: 'Orange', cls: 'c-orange' },
      { key: 'brown',  label: 'Brown',  cls: 'c-brown' },
      { key: 'other',  label: 'Other',  cls: 'c-other' }
    ];

    const STORAGE_KEY = 'carColorCounts_v1';
    const HISTORY_KEY = 'carColorHistory_v1';

    let counts = loadCounts();
    let history = loadHistory();

    function loadCounts() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        const out = {};
        COLORS.forEach(c => out[c.key] = saved[c.key] || 0);
        return out;
      } catch (e) {
        const out = {};
        COLORS.forEach(c => out[c.key] = 0);
        return out;
      }
    }

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      COLORS.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'color-btn ' + c.cls;
        btn.dataset.key = c.key;
        btn.innerHTML = `
          <button class="minus" data-action="minus" data-key="${c.key}" aria-label="decrease">−</button>
          <div class="count" id="count-${c.key}">0</div>
          <div class="label">${c.label}</div>
        `;
        btn.addEventListener('click', (e) => {
          if (e.target.dataset.action === 'minus') {
            decrement(c.key);
          } else {
            increment(c.key);
          }
        });
        grid.appendChild(btn);
      });
      render();
    }

    function increment(key) {
      counts[key]++;
      history.push({ action: 'inc', key });
      if (history.length > 200) history.shift();
      save();
      render();
      vibrate(15);
    }

    function decrement(key) {
      if (counts[key] > 0) {
        counts[key]--;
        history.push({ action: 'dec', key });
        if (history.length > 200) history.shift();
        save();
        render();
        vibrate(15);
      }
    }

    function undo() {
      const last = history.pop();
      if (!last) return;
      if (last.action === 'inc' && counts[last.key] > 0) counts[last.key]--;
      else if (last.action === 'dec') counts[last.key]++;
      save();
      render();
      vibrate(20);
    }

    function reset() {
      if (!confirm('Reset all counts to zero?')) return;
      COLORS.forEach(c => counts[c.key] = 0);
      history = [];
      save();
      render();
      vibrate(30);
    }

    function render() {
      let total = 0;
      COLORS.forEach(c => {
        const el = document.getElementById('count-' + c.key);
        if (el) el.textContent = counts[c.key];
        total += counts[c.key];
      });
      document.getElementById('total').textContent = total;
    }

    function showWinner() {
      const list = COLORS
        .map(c => ({ label: c.label, count: counts[c.key] }))
        .filter(c => c.count > 0)
        .sort((a, b) => b.count - a.count);

      const total = list.reduce((s, x) => s + x.count, 0);
      const container = document.getElementById('leaderList');
      const title = document.getElementById('modalTitle');

      if (list.length === 0) {
        title.textContent = 'No cars yet';
        container.innerHTML = '<div style="text-align:center;padding:20px;opacity:0.7;">Tap a color to start counting</div>';
      } else {
        title.textContent = 'Winner: ' + list[0].label + '!';
        container.innerHTML = list.map((c, i) => {
          const pct = total ? Math.round((c.count / total) * 100) : 0;
          const cls = i === 0 ? 'first' : i === 1 ? 'second' : i === 2 ? 'third' : '';
          const medal = i === 0 ? '🥇 ' : i === 1 ? '🥈 ' : i === 2 ? '🥉 ' : '';
          return `<div class="leader-row ${cls}"><span>${medal}${c.label}</span><span>${c.count} (${pct}%)</span></div>`;
        }).join('');
      }

      document.getElementById('modalBg').classList.add('show');
    }

    function vibrate(ms) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('resetBtn').addEventListener('click', reset);
    document.getElementById('winnerBtn').addEventListener('click', showWinner);
    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalBg').classList.remove('show');
    });
    document.getElementById('modalBg').addEventListener('click', (e) => {
      if (e.target.id === 'modalBg') {
        document.getElementById('modalBg').classList.remove('show');
      }
    });

    buildGrid();
  </script>
</body>
</html>
